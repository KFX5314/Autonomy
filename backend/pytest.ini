[pytest]
testpaths = tests
addopts = -ra
asyncio_mode = auto
markers =
    integration: tests that use the MariaDB test database
    audio_mocked: audio endpoint tests with STT/diarization/LLM mocked
    audio_real: local-only tests that require private audio fixtures
    local_llm: local-only tests that require an LLM provider
    performance: local timing checks, not intended for CI
    server_e2e: optional external-server HTTP flow tests
